<!DOCTYPE html>
<html lang="en" class="bg-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotify - Clone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="assets/css/home.css" />
    <link rel="icon" type="image/x-icon" href="assets/imgs/spotify.ico" />
  </head>

  <body>
    <div id="mainWrapper" class="container-fluid d-flex bg-black px-0 py-1">
      <aside id="aside-sx" class="d-flex flex-column align-items-start">
        <div id="sxside"></div>
      </aside>

      <div
        style="margin-top: 60px; margin-bottom: 100px"
        id="contenuto"
        class="container-fluid bg-dark px-2 px-md-5 py-4 pt-0"
      >
        <nav class="ps-5 navbar bg-dark position-fixed">
          <div class="container-fluid justify-content-start px-0">
            <a
              style="background-color: #131313; margin-right: 8px"
              class="text-light rounded-circle fs-3 px-2"
              href="#"
              ><i class="bi bi-arrow-left-short d-none d-md-block"></i
            ></a>
            <a
              style="background-color: #131313"
              class="text-light rounded-circle fs-3 px-2"
              href="#"
              ><i class="bi bi-arrow-right-short d-none d-md-block"></i
            ></a>
            <form
              style="display: none"
              id="form-input"
              class="px-2 position-relative"
              role="search"
            >
              <input
                id="input-search"
                style="width: 200px; padding-left: 40px"
                class="form-control me-2 rounded-pill"
                type="search"
                placeholder="Cerca"
                aria-label="Search"
              />
              <i
                style="left: 15px; top: 0; z-index: 99999"
                class="bi bi-search fs-4 text-decoration-none text-black position-absolute"
              ></i>
            </form>
          </div>
        </nav>

        <div
          id="card-principale"
          style="
            background: rgb(2, 0, 36);
            background: linear-gradient(
              16deg,
              rgb(0, 0, 0) 0%,
              rgba(33, 37, 41, 1) 63%
            );
          "
          class="card bg-black text-light rounded-0 border-0 px-3 py-3 mb-5 d-none d-md-block"
        >
          <div id="spinner" class="spinner-border text-success" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <!-- fetchCardPrincipale -->
        </div>

        <p class="fw-bold fs-1 mb-3 text-light">Ciao</p>
        <div class="d-flex justify-content-between">
          <div
            id="card-playlist"
            class="row row-cols-2 row-cols-lg-3 mb-5 gx-3"
          >
            <!-- fetchCardPlaylist -->
          </div>
        </div>

        <div class="container-fluid d-flex justify-content-between px-0 mb-3">
          <p class="fw-bold fs-4 mb-3 text-light">Altro di ciò che ti piace</p>
          <a class="text-secondary text-decoration-none" href="#"
            ><small>VISUALIZZA TUTTO</small></a
          >
        </div>
        <div
          id="cards2"
          class="row row-cols-1 row-cols-md-2 row-cols-lg-4 mb-5 row-gap-3"
        >
          <!-- fetchCards2 -->
        </div>

        <div class="container-fluid d-flex justify-content-between px-0 mb-3">
          <p class="fw-bold fs-4 mb-3 text-light">Album</p>
          <a class="text-secondary text-decoration-none" href="#"
            ><small>VISUALIZZA TUTTO</small></a
          >
        </div>
        <div
          id="recenti"
          class="row row-cols-1 row-cols-md-2 row-cols-lg-4 mb-5 row-gap-3"
        >
          <!-- fetchRecenti -->
        </div>
      </div>

      <aside id="aside-dx" class="bg-black">
        <div id="dxside"></div>
      </aside>

      <div
        id="player"
        style="bottom: 0; left: 0; right: 0; z-index: 99999"
        class="container-fluid position-fixed bg-dark py-3 px-4"
      >
        <div id="player-container"></div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
      crossorigin="anonymous"
    ></script>
    <script src="assets/script/home.js" type="module"></script>
    <script type="module" src="assets/script/main.js"></script>
  </body>
</html>
