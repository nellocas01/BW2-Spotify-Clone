<!DOCTYPE html>
<html class="bg-black" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Risultato Ricerca</title>
    <link rel="stylesheet" href="assets/css/search.css" />
    <link rel="stylesheet" href="assets/css/circular-font.css" />
    <link rel="icon" type="image/x-icon" href="assets/imgs/spotify.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <div class="container-fluid d-flex p-0 bg-black">
      <aside
        id="aside-sx"
        class="d-flex flex-column align-items-start bg-black"
      >
        <div id="sxside"></div>
      </aside>

      <div
        style="margin-left: 320px; margin-right: 320px; padding: 1rem"
        class="d-flex justify-content-between flex-column"
      >
        <h1 class="mb-4 text-white">Risultati ricerca</h1>
        <div id="search-details" class="row row-cols-1 mb-5 gx-3">
          <!-- contenuto dinamico -->
        </div>
      </div>

      <aside
        class="d-none d-lg-block bg-black"
        style="
          height: 100%;
          width: 240px;
          position: fixed;
          z-index: 1;
          top: 0;
          right: 0;
        "
      >
        <div id="dxside"></div>
      </aside>
      <div
        id="player"
        style="bottom: 0; left: 0; right: 0; z-index: 99999"
        class="container-fluid position-fixed bg-dark py-3 px-4"
      >
        <div id="player-container"></div>
      </div>
    </div>
    <script type="module" src="assets/script/search.js"></script>
    <script src="assets/script/main.js" type="module"></script>
  </body>
</html>
