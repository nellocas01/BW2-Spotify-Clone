<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotify - Artist</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="assets/css/artist.css" />
    <link rel="icon" type="image/x-icon" href="assets/imgs/spotify.ico" />
  </head>
  <body>
    <div class="container-fluid d-flex p-0 bg-dark">
      <aside
        id="aside-sx"
        class="d-flex flex-column align-items-start bg-black"
      >
        <div id="sxside"></div>
      </aside>
      <div
        id="main"
        class="artist-container d-flex flex-column flex-wrap bg-dark w-100"
      >
        <nav class="navbar position-fixed">
          <div class="container-fluid justify-content-start px-3">
            <a
              style="background-color: #131313; margin-right: 8px"
              class="text-light rounded-circle fs-3 px-2"
              href="#"
              ><i class="bi bi-arrow-left-short"></i
            ></a>
            <a
              style="background-color: #131313"
              class="text-light rounded-circle fs-3 px-2"
              href="#"
              ><i class="bi bi-arrow-right-short"></i
            ></a>
          </div>
        </nav>

        <div
          id="artistBanner"
          class="d-flex flex-column align-items-start px-3 ps-4 position-relative"
        >
          <!-- createCardArtist -->
          <div id="artistCardContent" class="container"></div>

          <div class="my-3 px-4">
            <button id="playBtn" class="p-2 rounded-circle me-4">
              <svg
                role="img"
                height="28"
                width="28"
                aria-hidden="true"
                viewBox="0 0 24 24"
                data-encore-id="icon"
                class="Svg-sc-ytk21e-0 uPxdw"
              >
                <path
                  d="m7.05 3.606 13.49 7.788a.7.7 0 0 1 0 1.212L7.05 20.394A.7.7 0 0 1 6 19.788V4.212a.7.7 0 0 1 1.05-.606z"
                ></path>
              </svg>
            </button>
            <button
              class="mx-3 py-1 px-3 text-white bg-dark border border-white"
            >
              Following
            </button>
            <button
              id="moreBtn"
              class="p-2 rounded-circle me-1 d-none d-lg-inline-block"
            >
              <svg
                role="img"
                height="32"
                width="32"
                aria-hidden="true"
                viewBox="0 0 24 24"
                data-encore-id="icon"
                class="Svg-sc-ytk21e-0 uPxdw"
              >
                <path
                  d="M4.5 13.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm15 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm-7.5 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"
                ></path>
              </svg>
            </button>
            <button
              id="moreBtn"
              class="p-2 rounded-circle me-1 d-inline-block d-lg-none"
            >
              <svg
                role="img"
                height="32"
                width="32"
                aria-hidden="true"
                viewBox="0 0 24 24"
                data-encore-id="icon"
                class="Svg-sc-ytk21e-0 gQUQL"
              >
                <path
                  d="M10.5 4.5a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0zm0 15a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0zm0-7.5a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0z"
                ></path>
              </svg>
            </button>
          </div>
          <div
            id="list"
            class="row justify-content-start"
            style="margin-inline: 12px"
          >
            <div class="col-11 col-lg-7 order-1 order-lg-0 text-white">
              <h3 class="text-white fs-5 fw-bold ms-5">Popolari</h3>
              <div id="tracks" class="container-fluid px-0">
                <!-- createSongArtist -->
              </div>
            </div>
            <div id="like" class="col-11 col-lg-3 order-0 order-md-0 pb-5">
              <!-- createLike -->
            </div>
          </div>
        </div>
        <aside
          class="d-none d-xl-block bg-black ps-2"
          style="
            height: 100%;
            width: 240px;
            position: fixed;
            z-index: 1;
            top: 0;
            right: 0;
          "
        >
          <div id="dxside"></div>
        </aside>
        <div
          id="player"
          style="bottom: 0; left: 0; right: 0; z-index: 99999"
          class="container-fluid position-fixed bg-dark py-3 px-4"
        >
          <div id="player-container"></div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
      crossorigin="anonymous"
    ></script>
    <script src="assets/script/artist.js" type="module"></script>
    <script src="assets/script/main.js" type="module"></script>
  </body>
</html>
