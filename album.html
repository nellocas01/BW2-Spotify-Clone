<!DOCTYPE html>
<html class="bg-black" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotify - Album</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="assets/css/album.css" />
    <link rel="stylesheet" href="assets/css/circular-font.css" />
    <link rel="icon" type="image/x-icon" href="assets/imgs/spotify.ico" />
  </head>
  <body>
    <div class="container-fluid d-flex p-0 bg-black">
      <aside
        id="aside-sx"
        class="d-flex flex-column align-items-start bg-black"
      >
        <div id="sxside"></div>
      </aside>
      <main class="container-fluid px-0">
        <nav class="navbar position-fixed">
          <div class="container-fluid justify-content-start px-3">
            <a
              style="background-color: #131313; margin-right: 8px"
              class="text-light rounded-circle fs-3 px-2"
              href="#"
              ><i class="bi bi-arrow-left-short"></i
            ></a>
            <a
              style="background-color: #131313"
              class="text-light rounded-circle fs-3 px-2"
              href="#"
              ><i class="bi bi-arrow-right-short"></i
            ></a>
          </div>
        </nav>
        <!-- card principale -->
        <div id="albumInfo" class="container-fluid"></div>
        <div id="albumContentWrapper">
          <div
            id="albumContent"
            class="container-fluid py-4 px-4 text-white mt-0"
          >
            <div class="mb-2">
              <button id="playBtn" class="p-2 rounded-circle me-4">
                <svg
                  role="img"
                  height="28"
                  width="28"
                  aria-hidden="true"
                  viewBox="0 0 24 24"
                  data-encore-id="icon"
                  class="Svg-sc-ytk21e-0 uPxdw"
                >
                  <path
                    d="m7.05 3.606 13.49 7.788a.7.7 0 0 1 0 1.212L7.05 20.394A.7.7 0 0 1 6 19.788V4.212a.7.7 0 0 1 1.05-.606z"
                  ></path>
                </svg>
              </button>
              <button id="favBtn" class="p-2 rounded-circle me-1">
                <svg
                  role="img"
                  height="32"
                  width="32"
                  aria-hidden="true"
                  viewBox="0 0 24 24"
                  data-encore-id="icon"
                  class="Svg-sc-ytk21e-0 uPxdw"
                >
                  <path
                    d="M5.21 1.57a6.757 6.757 0 0 1 6.708 1.545.124.124 0 0 0 .165 0 6.741 6.741 0 0 1 5.715-1.78l.004.001a6.802 6.802 0 0 1 5.571 5.376v.003a6.689 6.689 0 0 1-1.49 5.655l-7.954 9.48a2.518 2.518 0 0 1-3.857 0L2.12 12.37A6.683 6.683 0 0 1 .627 6.714 6.757 6.757 0 0 1 5.21 1.57zm3.12 1.803a4.757 4.757 0 0 0-5.74 3.725l-.001.002a4.684 4.684 0 0 0 1.049 3.969l.009.01 7.958 9.485a.518.518 0 0 0 .79 0l7.968-9.495a4.688 4.688 0 0 0 1.049-3.965 4.803 4.803 0 0 0-3.931-3.794 4.74 4.74 0 0 0-4.023 1.256l-.008.008a2.123 2.123 0 0 1-2.9 0l-.007-.007a4.757 4.757 0 0 0-2.214-1.194z"
                  ></path>
                </svg>
              </button>
              <button id="downloadBtn" class="p-2 rounded-circle me-1">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="32"
                  height="32"
                  class="bi bi-arrow-down-circle"
                  viewBox="0 0 16 16"
                >
                  <path
                    fill-rule="evenodd"
                    d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8zm15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.5 4.5a.5.5 0 0 0-1 0v5.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V4.5z"
                  />
                </svg>
              </button>
              <button
                id="moreBtn"
                class="p-2 rounded-circle me-1 d-none d-lg-inline-block"
              >
                <svg
                  role="img"
                  height="32"
                  width="32"
                  aria-hidden="true"
                  viewBox="0 0 24 24"
                  data-encore-id="icon"
                  class="Svg-sc-ytk21e-0 uPxdw"
                >
                  <path
                    d="M4.5 13.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm15 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm-7.5 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"
                  ></path>
                </svg>
              </button>
              <button
                id="moreBtn"
                class="p-2 rounded-circle me-1 d-inline-block d-lg-none"
              >
                <svg
                  role="img"
                  height="32"
                  width="32"
                  aria-hidden="true"
                  viewBox="0 0 24 24"
                  data-encore-id="icon"
                  class="Svg-sc-ytk21e-0 gQUQL"
                >
                  <path
                    d="M10.5 4.5a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0zm0 15a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0zm0-7.5a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0z"
                  ></path>
                </svg>
              </button>
            </div>
            <div class="row mb-1 mt-4 light-gray d-none d-lg-flex">
              <div class="col-1 fw-semibold songNumber">#</div>
              <div class="col-4 fw-semibold">TITOLO</div>
              <div class="col-3 text-end fw-semibold">RIPRODUZIONI</div>
              <div class="col-3 text-end">
                <svg
                  id="clockIcon"
                  role="img"
                  height="16"
                  width="16"
                  aria-hidden="true"
                  viewBox="0 0 16 16"
                  data-encore-id="icon"
                  class="Svg-sc-ytk21e-0 uPxdw"
                >
                  <path
                    d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8z"
                  ></path>
                  <path
                    d="M8 3.25a.75.75 0 0 1 .75.75v3.25H11a.75.75 0 0 1 0 1.5H7.25V4A.75.75 0 0 1 8 3.25z"
                  ></path>
                </svg>
              </div>
            </div>
            <hr />
            <!-- crea canzone -->
            <div id="row-canzoni" class="container-fluid px-0"></div>
          </div>
        </div>
      </main>
      <aside
        class="d-none d-lg-block bg-black"
        style="
          height: 100%;
          width: 240px;
          position: fixed;
          z-index: 1;
          top: 0;
          right: 0;
        "
      >
        <div id="dxside"></div>
      </aside>
      <div
        id="player"
        style="bottom: 0; left: 0; right: 0; z-index: 99999"
        class="container-fluid position-fixed bg-dark py-3 px-4"
      >
        <div id="player-container"></div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
      crossorigin="anonymous"
    ></script>
    <script src="assets/script/album.js" type="module"></script>
    <script>
      async function includeHTML(id, file) {
        const el = document.getElementById(id);
        if (!el) return;
        const res = await fetch(file);
        const html = await res.text();
        el.innerHTML = html;
      }

      window.addEventListener("DOMContentLoaded", () => {
        includeHTML("sxside", "assets/partials/sxside.html");
        includeHTML("dxside", "assets/partials/dxside.html");
        includeHTML("player-container", "assets/partials/player.html");
      });
    </script>
  </body>
</html>
